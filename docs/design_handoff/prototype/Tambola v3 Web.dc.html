<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Letsplaytambola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(0.21 0.07 295)}a{color:oklch(0.83 0.16 78)}a:hover{color:oklch(0.97 0.02 85)}</style>
</helmet>
<div style="width:100%;height:100vh;min-height:640px">
  <dc-import name="TambolaPhone" layout="web" seat="solo" currency="{{ currency }}" style="width:100%;height:100%" hint-size="100%,100vh"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;₹&quot;,&quot;$&quot;,&quot;£&quot;,&quot;€&quot;],&quot;default&quot;:&quot;₹&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { currency: this.props.currency ?? '₹' }; }
}
</script>
</body>
</html>
