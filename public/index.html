<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Letsplaytambola — play Tambola with family &amp; friends</title>
    <meta name="description" content="You’re invited to a game of Tambola (Housie). Tap to join — play in your browser, no download needed. Free, just for fun." />
    <meta name="theme-color" content="#1B0F34" />
    <meta name="color-scheme" content="dark" />

    <!--
      Link preview (WhatsApp, iMessage, Facebook, X). This app is a single page, so every link — including
      /g/CODE invites — shows this same preview. Per-game previews: docs/RELEASE.md, "Optional: per-game link previews".
      The domain below is the default; `npm run build:web` swaps in EXPO_PUBLIC_WEB_URL (scripts/web-postbuild.js).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Letsplaytambola" />
    <meta property="og:title" content="Let’s play Tambola!" />
    <meta property="og:description" content="You’re invited to a game of Tambola (Housie). Tap to join — play in your browser, no download needed. Free, just for fun." />
    <meta property="og:url" content="https://letsplaytambola.app/" />
    <meta property="og:image" content="https://letsplaytambola.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Let’s play Tambola" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Let’s play Tambola!" />
    <meta name="twitter:description" content="You’re invited to a game of Tambola (Housie). Tap to join — play in your browser, no download needed. Free, just for fun." />
    <meta name="twitter:image" content="https://letsplaytambola.app/og.png" />

    <!-- Add to home screen -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tambola" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Full-height app; plum from the first paint so there is no white flash. */
      html,
      body {
        height: 100%;
        background-color: #1B0F34;
      }
      /* The app scrolls inside <ScrollView>, not the body. */
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Letsplaytambola needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
